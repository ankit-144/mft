<script type="application/json" id="map-data">{"nodes":[{"id":"system","parent":null,"title":"How MFT fits together","kind":"overview","tagline":"Follow a price from the market to a decision.","summary":"Ingestion saves live prices. Inference suggests trades from completed minutes. Execution checks risk and owns the order. Historical jobs add older prices; research compares ideas offline.","children":["broker","ingestion","storage","inference","execution","jobs","research","configuration","operations"],"responsibilities":["Read the high-level wiring first.","Open a service to see the smaller blocks it uses.","Open a block to read its responsibility and interface contract."],"inputs":["Live market prices","Saved historical prices","Shared settings"],"outputs":["Saved candles","Trade decisions and order state","Research reports and service status"],"contracts":[],"files":[{"path":"docker-compose.yml","why":"The four service processes and shared data volume."},{"path":"core/contracts/contracts.go","why":"Shared data exchanged at component boundaries."}],"sequence":[]},{"id":"execution","parent":"system","title":"Execution","kind":"service","tagline":"Own the order until its outcome is known.","summary":"Receives trade suggestions, checks account limits, remembers requests, and submits allowed orders. Confirmed fills update the account book. Risk runs inside this service.","responsibilities":["Accept signal and direct-order requests, then apply the same risk gate.","Persist each request claim and the account book so restarts can recover safely.","Reconcile broker order and position state before considering live execution ready."],"inputs":["HTTP signal/order requests with idempotency keys","Broker order, quote, and reconciliation interfaces","Validated execution configuration and shared cache"],"outputs":["Order acknowledgements and later status results","Portfolio exposure view","Risk rejections, logs, and execution metrics"],"contracts":[{"name":"ExecuteSignal / ExecuteOrder","meaning":"Submit through one keyed, risk-checked lifecycle."},{"name":"OrderStatus / Portfolio","meaning":"Read the latest known order state and account view."},{"name":"Initialize / Reconcile","meaning":"Recover state and compare it with broker state."}],"files":[{"path":"services/execution/cmd/server/main.go","why":"Composes core and execution modules."},{"path":"services/execution/engine.go","why":"Owns order lifecycle and reconciliation."}],"children":["execution-http","execution-engine","execution-journal","execution-exits","risk"],"sequence":["execution-http","execution-engine","risk","execution-journal"],"connections":[{"target":"configuration","label":"reads execution settings"},{"target":"config-contracts","label":"uses shared signal, order, portfolio types"},{"target":"operations","label":"publishes health, metrics, and logs"}]},{"id":"execution-http","parent":"execution","title":"HTTP API","kind":"interface","tagline":"Translates HTTP requests into engine calls.","summary":"Provides order submission and read routes, with request validation, optional token authentication, and stable error responses.","responsibilities":["Serve POST /v1/signals and POST /v1/orders.","Serve portfolio and health endpoints.","Report accepted submission separately from broker fill; later status may still be submitting or unknown."],"inputs":["JSON requests","Execution engine interface","Optional execution API token"],"outputs":["JSON order response, portfolio, health, or transport error","HTTP request and duration metrics"],"contracts":[{"name":"NewHandler","meaning":"Build the authenticated API handler."},{"name":"Executor","meaning":"Required engine methods for submit, status, and portfolio."}],"files":[{"path":"services/execution/http.go","why":"Routes, authentication, serialization, and HTTP lifecycle."}],"children":[],"connections":[{"target":"execution-engine","label":"delegates validated requests"}],"sequence":[]},{"id":"execution-engine","parent":"execution","title":"Order engine","kind":"component","tagline":"Coordinates checks, claims, broker calls, and fills.","summary":"Coordinates checks, reservations, request persistence and broker calls. It treats “the broker received the order” separately from “shares actually traded”.","responsibilities":["Normalize and validate signal/order fields and reject stale or unsafe requests.","Reserve exposure, persist a submitting claim, then call the broker.","Apply only reported filled quantity and average price; keep indeterminate broker outcomes unknown for reconciliation."],"inputs":["Signal or order request","Risk policy and current portfolio","Broker client, quote client, cache, and journal"],"outputs":["Order ID or typed rejection/uncertain outcome","Updated durable order records and fill-based book","Readiness and reconciliation state"],"contracts":[{"name":"ExecuteSignal / ExecuteOrder","meaning":"Enter the common idempotent submission path."},{"name":"Ready","meaning":"Report whether execution can safely accept work."},{"name":"Reconcile / CloseContext","meaning":"Refresh broker state and stop within caller bounds."}],"files":[{"path":"services/execution/engine.go","why":"Submission, reservations, fill accounting, recovery, and reconciliation."}],"children":[],"connections":[{"target":"risk","label":"checks request and owns account book"},{"target":"execution-journal","label":"persists claims and accounting"},{"target":"execution-exits","label":"runs exit requests after successful reconciliation"}],"sequence":[]},{"id":"execution-journal","parent":"execution","title":"Execution journal","kind":"storage","tagline":"Durable claims and account snapshots across restarts.","summary":"Saves request IDs, order state and the account snapshot across restarts. If the service stopped after starting a broker request but before learning the result, it remembers that uncertainty instead of automatically ordering again.","responsibilities":["Load and validate versioned JSON state under an exclusive process lock.","Atomically replace persisted state with restrictive file permissions.","Keep claims durable before submission so retries do not blindly duplicate uncertain broker calls."],"inputs":["Configured journal path","Order records and risk book state"],"outputs":["Validated state for recovery","Durably saved claims and account book"],"contracts":[{"name":"openJournal","meaning":"Lock and load the journal or initialize empty state."},{"name":"journal.Save","meaning":"Persist a complete replacement state."},{"name":"journal.Close","meaning":"Release the process lock."}],"files":[{"path":"services/execution/journal.go","why":"Journal schema, validation, locking, and writes."}],"children":[],"connections":[{"target":"execution-engine","label":"supports restart recovery"}],"sequence":[]},{"id":"execution-exits","parent":"execution","title":"Exit policy hook","kind":"extension","tagline":"Routes risk-reducing sell orders through normal controls.","summary":"The engine can be given a strategy-owned policy that derives orders from the reconciled portfolio. Exit requests still need a SELL side and an idempotency key, and use the ordinary risk and durable submission path.","responsibilities":["Allow an exit policy to be installed independently of the engine.","Run it after reconciliation and submit emitted SELL requests normally.","Ignore already claimed duplicate exit requests while surfacing other failures."],"inputs":["Current portfolio snapshot","ExitPolicy implementation"],"outputs":["Durable sell requests or an error"],"contracts":[{"name":"ExitPolicy.ExitOrders","meaning":"Derive exit requests from a portfolio."},{"name":"SetExitPolicy / RunExitPolicy","meaning":"Install and invoke the policy."}],"files":[{"path":"services/execution/exits.go","why":"Exit policy interface and engine integration."}],"children":[],"sequence":[]},{"id":"risk","parent":"execution","title":"Risk","kind":"module","tagline":"Decide whether the account can take this trade.","summary":"Reads the current account, includes money or shares reserved by pending requests, and runs the configured limits. Its account book tracks what has actually been filled.","responsibilities":["Validate signal basics and enforce the configured ordered check chain.","Keep cash, held quantities, average cost, realized PnL, and current marks.","Provide durable snapshots and a portfolio view to execution."],"inputs":["Execution risk settings","Signal and portfolio including reservations","Confirmed fills and quote marks"],"outputs":["Typed risk rejection or pass","Portfolio and serializable book state"],"contracts":[{"name":"Policy.New","meaning":"Compose the seven checks in fixed order."},{"name":"Book.ApplyFill / Book.Mark","meaning":"Record confirmed trade fills and held-position marks."},{"name":"Book.SnapshotAt / Book.State","meaning":"Return portfolio and durable accounting snapshot."}],"files":[{"path":"services/execution/risk/risk.go","why":"Policy construction and check ordering."},{"path":"services/execution/risk/book.go","why":"Cash, positions, marks, PnL, and portfolio ownership."}],"children":["risk-book","risk-checks","risk-market","risk-clock"],"sequence":[]},{"id":"risk-book","parent":"risk","title":"Account book · book.go","kind":"data owner","tagline":"Remember cash, owned shares and their current value.","summary":"This is the account’s ledger. A confirmed buy reduces cash and adds shares; a confirmed sell does the reverse. Latest prices update what those shares are worth. Sending an order alone does not change the holdings.","responsibilities":["Track cash, owned quantities and average purchase cost.","Apply confirmed fills, including partial fills.","Value held shares using the latest supplied prices.","Return a copy of the account state for checks and persistence."],"inputs":["Starting cash or a restored account state","Confirmed buy/sell quantities and prices","Latest prices for held symbols"],"outputs":["Cash, holdings and total account value","Realized profit or loss and the fall from the previous peak","A snapshot that can be saved or checked"],"contracts":[{"name":"NewBook / RestoreBook","meaning":"Create or restore account bookkeeping."},{"name":"ApplyFill","meaning":"Apply the filled portion of a trade."},{"name":"Mark / MarkAge","meaning":"Update and assess held-position marks."},{"name":"SnapshotAt / State / FreeCash","meaning":"Read portfolio, durable snapshot, or cash."}],"files":[{"path":"services/execution/risk/book.go","why":"Authoritative account data and calculations."}],"children":[],"sequence":[],"concepts":[{"term":"Fill","meaning":"The quantity the broker says actually traded, which may be less than requested."},{"term":"Mark","meaning":"The latest price used to value shares you still hold."},{"term":"Equity","meaning":"Cash plus the current value of held shares."}]},{"id":"risk-checks","parent":"risk","title":"Risk checks","kind":"policy","tagline":"Rejects requests that exceed configured limits.","summary":"Checks available money, allowed position size and count, losses, repeated entries, valid quantity, and trading hours. It stops at the first failed rule and returns a stable reason.","responsibilities":["Measure proposed buy exposure against marked positions and reserved orders.","Enforce account and order limits and ensure sells do not exceed available long holdings.","Return stable rejection reason codes for callers and metrics."],"inputs":["Signal","Portfolio with held and reserved exposure","Policy limits and TTL cache"],"outputs":["Pass or typed contracts.Rejection"],"contracts":[{"name":"Checker.Check","meaning":"Check one signal against a portfolio."},{"name":"Checks.Check","meaning":"Run checkers in order, stopping on first error."},{"name":"ValidateSignal","meaning":"Check required signal fields before policy checks."}],"files":[{"path":"services/execution/risk/checks.go","why":"Position, count, drawdown, loss, debounce, and quantity rules."},{"path":"services/execution/risk/risk.go","why":"Ordered policy assembly."}],"children":[],"sequence":[]},{"id":"risk-market","parent":"risk","title":"Market calendar","kind":"policy input","tagline":"Applies NSE session time and configured holidays.","summary":"Market-hours checks use Asia/Kolkata local time, weekdays, and configured holiday dates. The calendar is injected so the session rule does not depend on the machine's local timezone.","responsibilities":["Convert the current time to IST for trading-date decisions.","Reject weekends, configured holidays, and times outside 09:15–15:30 inclusive.","Supply a static holiday calendar from execution configuration."],"inputs":["Injected clock","Configured YYYY-MM-DD holiday dates"],"outputs":["Calendar holiday answer","Market closed rejection or pass"],"contracts":[{"name":"Calendar.IsHoliday","meaning":"Tell whether an instant falls on an IST holiday date."},{"name":"MarketHoursCheck.Check","meaning":"Enforce NSE cash-market session bounds."},{"name":"NewStaticCalendar","meaning":"Build a calendar from configured dates."}],"files":[{"path":"services/execution/risk/market.go","why":"IST, holiday calendar, and trading session rule."}],"children":[],"sequence":[]},{"id":"risk-clock","parent":"risk","title":"Clock interface","kind":"dependency","tagline":"Makes time decisions explicit and replaceable.","summary":"Risk policy receives a clock function, with a UTC system clock as the default. The same injected clock supports signal-age decisions and market session checks consistently.","responsibilities":["Provide current time to policy decisions.","Default to current UTC time when no clock is supplied.","Allow deterministic integrations to supply another clock."],"inputs":["Optional time source"],"outputs":["Current instant"],"contracts":[{"name":"Clock","meaning":"Function that returns the current time."},{"name":"SystemClock","meaning":"Return the current instant in UTC."}],"files":[{"path":"services/execution/risk/clock.go","why":"Clock contra e calls.","summary":"Order calls validate symbol, side, quantity, type, and price before submitting. The connector also exposes order reconciliation and last-price reads used by account and risk callers.","responsibilities":["Submit supported market or limit orders and return broker identifiers.","Read and cancel broker orders, positions, and configured instrument prices."],"inputs":["OrderRequest, order ID, symbol list"],"outputs":["Order IDs, normalized order/position states, last prices"],"contracts":[{"name":"OrderClient.PlaceOrder","meaning":"Submits an order request and returns its broker order ID."},{"name":"OrderClient.CancelOrder","meaning":"Requests cancellation by broker order ID."},{"name":"OrderReconciler.GetOrder","meaning":"Reads broker state for an order whose outcome needs checking."},{"name":"QuoteClient.GetLastPrices","meaning":"Returns available last traded prices keyed by symbol."}],"files":[{"path":"core/broker/orders.go","why":"Order validation, reconciliation types, positions, and quote queries."},{"path":"core/broker/broker.go","why":"Consumer-facing order interfaces."}],"children":[],"sequence":[]},{"id":"broker-instruments","parent":"broker","title":"Instrument lookup","kind":"component","tagline":"Connects configured symbols to broker tokens.","summary":"The connector reads the broker instrument CSV and keeps the configured watchlist's resolved instruments in a time-limited cache. Stream subscriptions and order requests rely on this lookup.","responsibilities":["Normalize and deduplicate configured symbols.","Resolve exchange, token, and instrument metadata or report a missing instrument."],"inputs":["Configured symbols and broker instrument dump"],"outputs":["contracts.Instrument values and symbol-to-token resolution"],"contracts":[{"name":"Instruments","meaning":"Returns resolved instruments for the configured watchlist."},{"name":"Instrument","meaning":"Looks up one normalized symbol from the loaded instrument set."}],"files":[{"path": ecycle, bounded handoff, tick processing, candle completion, and error reporting."},{"path":"services/ingestion/candles.go","why":"Candle writer adapter used by the pipeline."},{"path":"services/ingestion/cmd/server/main.go","why":"Starts the live ingestion service."}],"children":["ingestion-pipeline","ingestion-candles","ingestion-buffer"],"connections":[{"target":"storage-writer","label":"append tick and candle rows"}],"sequence":[]},{"id":"ingestion-pipeline","parent":"ingestion","title":"Tick-to-candle pipeline","kind":"component","tagline":"Accepts ticks, folds the current minute, and closes earlier minutes.","summary":"Each accepted tick is first offered to the raw tick writer, then used to update the symbol's open candle. A minute is appended when a later tick or periodic sweep makes it complete; the still-open candle is not treated as a completed candle on shutdown.","responsibilities":["Calculate candle open, high, low, close, and volume from tick updates.","Ignore ticks for a minute already persisted and retry a pending candle append when capacity is reached."],"inputs":["broker.Tick values and current time"],"outputs":["Tick writer rows and completed one-minute candle appends"],"contracts":[{"name":"Pipeline.handle","meaning":"Accepts a tick into raw storage before folding it into in-memory candle state."},{"name":"Pipeline.sweep","meaning":"Checks whether open candles have aged into completed candles."}],"files":[{"path":"services/ingestion/pipeline.go","why":"Tick acceptance, candle folding, late tick handling, and rollover logic."}],"children":[],"sequence":[]},{"id":"ingestion-candles","parent":"ingestion","title":"Candle writer adapter","kind":"component","tagline":"Gives ingestion a dedicated handle to the shared candle writer.","summary":"CandleStore wraps core storage's candle writer so ingestion can run both tick and candle writers in one lifecycle. Append status distinguishes rejection from a candle retained despite a flush error.","responsibili ow ownership contract."}],"children":[],"concepts":[{"term":"backpressure","meaning":"A full bounded buffer makes upstream processing wait or retain responsibility for the row."}],"sequence":[]},{"id":"storage","parent":"system","title":"Shared storage","kind":"library","tagline":"The files both sides agree on.","summary":"Provides shared file-writing and reading boundaries. Services exchange candle data through Parquet files; there is no separate storage server.","responsibilities":["Buffer and publish immutable live data files under symbol/date partitions.","List and merge live candle files for time-range and recent-history reads."],"inputs":["Typed rows, roots, flush limits and interval"],"outputs":["Parquet files and ordered candle rows"],"contracts":[{"name":"RowWriter","meaning":"Append rows, flush pending rows, and close the writer."},{"name":"CandleReader.CandleRange","meaning":"Returns candles in the requested half-open time range in ascending time order."}],"files":[{"path":"core/storage/storage.go","why":"Dataset row types and tick/candle writer APIs."},{"path":"core/storage/reader.go","why":"Published candle file discovery and canonical candle queries."},{"path":"core/storage/layout.go","why":"Live and historical path partition rules."}],"children":["storage-writer","storage-reader","storage-analytics","storage-layout"],"sequence":[]},{"id":"storage-writer","parent":"storage","title":"Live Parquet writer","kind":"component","tagline":"Buffers tick or candle rows and writes immutable files by symbol and UTC date.","summary":"Rows are partitioned by symbol and UTC date. A background interval, row threshold, explicit Flush, or Close can trigger a write; successful writing publishes a complete Parquet file. Until then, accepted rows remain in memory and are not yet durable.","responsibilities":["Group buffered rows by partition and write each batch as a new immutable part file.","Retain rows for failed or unwritten partitions so a later flush can retry them. s":[{"path":"services/inference/app/main.py","why":"FastAPI app and runtime lifecycle."}],"contracts":[{"name":"GET /healthz","meaning":"Report inference service health."},{"name":"GET /readyz","meaning":"Report whether the model and decision loop are usable."},{"name":"GET /metrics","meaning":"Expose inference measurements."}],"children":[],"responsibilities":["The FastAPI app owns runtime startup and shutdown and reports health, model readiness and metrics. It is separate from the execution order API."],"inputs":["HTTP requests and the assembled Runtime"],"outputs":["Service status and metrics"],"concepts":[],"sequence":[],"jumps":[{"id":"operations","label":"How health and metrics fit together"}]},{"id":"research","parent":"system","title":"Research & backtesting","kind":"tool","tagline":"Compare ideas on saved history.","summary":"Runs offline experiments using saved candles. It compares algorithms on a validation period, then evaluates the selected candidate on a later period kept out of selection.","files":[{"path":"services/inference/app/research/engine.py","why":"Experiment orchestration."},{"path":"services/inference/app/research/__main__.py","why":"Research command-line entry."},{"path":"services/inference/app/research/__init__.py","why":"Public research API."}],"contracts":[{"name":"run_experiment","meaning":"Compare supplied candle data using declared settings."},{"name":"run_experiment_from_store","meaning":"Read bounded history through the candle-store boundary."}],"children":["research-config","research-splits","research-strategies","research-simulation","research-evaluators","research-report","research-replay"],"responsibilities":["Keep algorithm, trading strategy and result evaluator replaceable independently.","Charge the configured estimated costs in the simulation.","Select using validation results, then run the winner on held-out data."],"inputs":["Saved candles, candidate ideas and experiment assumptions"],"outputs":["A report with selection evidence, trades and metrics"],"concepts":[{"term":"Validation","meaning":"The earlier period used to choose an idea."},{"term":"Held-out test","meaning":"A later period used to judge the chosen idea without reselecting it."}],"sequence":["research-splits","research-strategies","research-simulation","research-evaluators","research-report"],"jumps":[{"id":"models","label":"Browse the candidate algorithms"}]},{"id":"research-config","parent":"research","title":"Experiment assumptions","kind":"block","tagline":"Write down what a result assumes.","summary":"Defines capital, costs, horizon, split sizes, candidate options and the names of strategy and evaluator plugins.","files":[{"path":"services/inference/app/research/config.py","why":"ExperimentConfig and CostAssumptions."},{"path":"services/inference/app/research/engine.py","why":"CandidateConfig."}],"contracts":[{"name":"ExperimentConfig","meaning":"Shared settings for one experiment."},{"name":"CostAssumptions","meaning":"Declared fees and slippage estimates."},{"name":"CandidateConfig","meaning":"One algorithm and its candidate parameters."}],"children":[],"responsibilities":["Defines capital, costs, horizon, split sizes, candidate options and the names of strategy and evaluator plugins."],"inputs":["Explicit research choices"],"outputs":["Validated experiment settings"],"concepts":[{"term":"Slippage","meaning":"An estimated difference between the quoted price and the simulated fill."}],"sequence":[],"jumps":[]},{"id":"research-splits","parent":"research","title":"Time split","kind":"block","tagline":"Keep future evidence out of selection.","summary":"Uses shared time boundaries across symbols for training, validation and testing. It removes decisions whose future labels would cross a boundary and leaves configured gaps.","files":[{"path":"services/inference/app/research/splits.py","why":"GlobalSplitPlan and split planners."}],"contracts":[{"name":"plan_global_splits","meaning":"Create shared chronological boundaries for all symbols."},{"name":"plan_splits","meaning":"Create the per-series training, validation and test ranges."}],"children":[],"responsibilities":["Uses shared time boundaries across symbols for training, validation and testing. It removes decisions whose future labels would cross a boundary and leaves configured gaps."],"inputs":["Candle timestamps and prediction horizon"],"outputs":["Non-overlapping decision ranges"],"concepts":[{"term":"Leakage","meaning":"Using information from a later period while choosing an earlier decision."},{"term":"Purge / embargo","meaning":"Removed boundary examples and a time gap that help keep future labels out of another split."}],"sequence":[],"jumps":[]},{"id":"research-strategies","parent":"research","title":"Strategy boundary","kind":"block","tagline":"Turn a model score into a position choice.","summary":"Algorithms estimate direction. A strategy decides whether that score means a long position, a short position or no trade. The default threshold strategy is long-only.","files":[{"path":"services/inference/app/research/adapters.py","why":"Strategy protocol and registry."}],"contracts":[{"name":"Strategy.side","meaning":"Return long, short or no position from one score."},{"name":"register_strategy","meaning":"Add a strategy factory under a new name."},{"name":"create_strategy","meaning":"Build a strategy with its declared options."}],"children":[],"responsibilities":["Algorithms estimate direction. A strategy decides whether that score means a long position, a short position or no trade. The default threshold strategy is long-only."],"inputs":["An algorithm score"],"outputs":["Long, short or no position"],"concepts":[],"sequence":[],"jumps":[{"id":"models","label":"Who produces the score?"}]},{"id":"research-simulation","parent":"research","title":"Portfolio simulation","kind":"block","tagline":"Walk through prices and account for each trade.","summary":"Processes the time sequence, closes positions when due and checks capital before opening new ones. Equity reflects changing prices and the configured estimated trading costs.","files":[{"path":"services/inference/app/research/engine.py","why":"Split simulation and portfolio accounting."}],"contracts":[{"name":"run_experiment","meaning":"Return candidate assessments and the selected test result."},{"name":"SplitEvaluation","meaning":"The trades, equity observations and metrics for one period."}],"children":[],"responsibilities":["Processes the time sequence, closes positions when due and checks capital before opening new ones. Equity reflects changing prices and the configured estimated trading costs."],"inputs":["Scored trade opportunities and all relevant price timestamps"],"outputs":["Trades and a time-stamped portfolio value series"],"concepts":[{"term":"Equity","meaning":"Cash plus the current value of held positions."},{"term":"Simulated fill","meaning":"An assumed execution price; this simulation does not place a real order."}],"sequence":[],"jumps":[]},{"id":"research-evaluators","parent":"research","title":"Evaluators","kind":"block","tagline":"Measure how an idea performed.","summary":"Reads completed portfolio observations and returns named metrics. Each selection metric declares whether larger or smaller is better and how much evidence it needs.","files":[{"path":"services/inference/app/research/evaluators.py","why":"MetricEvaluator, MetricSeries and evaluator registry."}],"contracts":[{"name":"MetricEvaluator.evaluate","meaning":"Turn completed result observations into named metrics."},{"name":"register_evaluator","meaning":"Add an evaluator factory and its selection rules."},{"name":"MetricRule","meaning":"Declare maximize/minimize and minimum observations."}],"children":["research-new-evaluator"],"responsibilities":["Calculate comparable result measurements.","Let experiments choose a declared selection metric.","Keep measurement separate from prediction and trading decisions."],"inputs":["Equity, returns, trades, turnover and estimated fees"],"outputs":["Named metrics such as net return, drawdown and daily Sharpe"],"concepts":[{"term":"Drawdown","meaning":"How far portfolio value has fallen from its earlier high."},{"term":"Sharpe","meaning":"A summary of return relative to its variation; it does not prove future profit."}],"sequence":[],"jumps":[]},{"id":"research-new-evaluator","parent":"research-evaluators","title":"Add an evaluator","kind":"guide","tagline":"Extend measurement through one boundary.","summary":"Implement the evaluator boundary, register its name and selection rules, then select that name in experiment settings. The same experiment engine calls it for every completed period.","files":[{"path":"services/inference/app/research/evaluators.py","why":"Extension contract and registry."},{"path":"services/inference/app/research/config.py","why":"Evaluator and selection metric settings."},{"path":"services/inference/app/tests/test_research.py","why":"Examples of a custom minimization metric."}],"contracts":[{"name":"evaluate(series, annualization_bars)","meaning":"Return a mapping of metric names to numbers or unavailable values."},{"name":"register_evaluator(name, selection_metrics=...)","meaning":"Register an evaluator factory and declare how its metrics are ranked."}],"children":[],"responsibilities":["Choose a stable metric name and define what it measures.","Declare whether to maximize or minimize it.","Declare the minimum observations needed before selection.","Exercise it on a small known portfolio series."],"inputs":["MetricSeries, which contains completed simulation observations"],"outputs":["A metric mapping consumed by selection and reports"],"concepts":[],"sequence":[],"jumps":[]},{"id":"research-report","parent":"research","title":"Selection & report","kind":"block","tagline":"Keep a record of why one idea won.","summary":"Ranks the validation assessments using the selected evaluator rule. It then records the winner’s held-out test result, settings and input fingerprints in the report.","files":[{"path":"services/inference/app/research/engine.py","why":"ExperimentResult and validation selection."},{"path":"services/inference/app/research/__main__.py","why":"Command-line report writing."}],"contracts":[{"name":"ExperimentResult.to_json","meaning":"Produce a report with settings, candidate evidence and the selected test result."}],"children":[],"responsibilities":["Ranks the validation assessments using the selected evaluator rule. It then records the winner’s held-out test result, settings and input fingerprints in the report."],"inputs":["Candidate validation metrics and experiment settings"],"outputs":["A reproducible research report"],"concepts":[],"sequence":[],"jumps":[{"id":"research-evaluators","label":"How measurements are supplied"}]},{"id":"research-replay","parent":"research","title":"Runtime-style replay","kind":"module","tagline":"Replay the live decision rules on saved candles.","summary":"The older backtest path shares feature, prediction and signal rules with runtime. It has its own portfolio accounting and reporting, separate from the generic experiment engine.","files":[{"path":"services/inference/app/backtest.py","why":"WalkForward and run_backtest."},{"path":"services/inference/app/backtest_portfolio.py","why":"Replay portfolio accounting."},{"path":"services/inference/app/backtest_cli.py","why":"CLI input and safety guards."},{"path":"services/inference/app/backtest_reporting.py","why":"Human and JSON reports."}],"contracts":[{"name":"WalkForward","meaning":"Score each step using only earlier context."},{"name":"run_backtest","meaning":"Replay supplied candles and return outcomes and accounting."}],"children":["replay-cli","replay-portfolio","replay-report"],"responsibilities":["The older backtest path shares feature, prediction and signal rules with runtime. It has its own portfolio accounting and reporting, separate from the generic experiment engine."],"inputs":["Stored or explicitly synthetic candles"],"outputs":["Replay decisions, trades and a report"],"concepts":[],"sequence":[],"jumps":[]},{"id":"replay-cli","parent":"research-replay","title":"Replay input & CLI","kind":"block","tagline":"Choose data and refuse unsafe model loading.","summary":"Loads the requested symbols and period from stored data or a synthetic generator. The weighted-model option needs explicit consent before the optional backend is built.","files":[{"path":"services/inference/app/backtest_cli.py","why":"Argument parsing and replay entry point."},{"path":"services/inference/app/synth.py","why":"Repeatable synthetic candles."}],"contracts":[{"name":"main","meaning":"Run the backtest command and return an exit status."},{"name":"plan_model","meaning":"Validate the model choice before creating it."}],"children":[],"responsibilities":["Loads the requested symbols and period from stored data or a synthetic generator. The weighted-model option needs explicit consent before the optional backend is built."],"inputs":["CLI flags and settings"],"outputs":["Validated input and a replay result"],"concepts":[],"sequence":[],"jumps":[]},{"id":"replay-portfolio","parent":"research-replay","title":"Replay portfolio","kind":"block","tagline":"Account for the replayed decisions.","summary":"Tracks the replay’s positions, fees, cash and equity over time. Its assumptions are reported separately from live execution accounting.","files":[{"path":"services/inference/app/backtest_portfolio.py","why":"Portfolio and simulation result types."}],"contracts":[{"name":"Portfolio","meaning":"Simulate the allowed trades and track accounting."}],"children":[],"responsibilities":["Tracks the replay’s positions, fees, cash and equity over time. Its assumptions are reported separately from live execution accounting."],"inputs":["Replay decisions and prices"],"outputs":["Trades and an equity curve"],"concepts":[],"sequence":[],"jumps":[]},{"id":"replay-report","parent":"research-replay","title":"Replay reporting","kind":"block","tagline":"Explain the outcomes of a replay.","summary":"Formats summaries and structured results, including configured costs and whether the input was synthetic.","files":[{"path":"services/inference/app/backtest_reporting.py","why":"Summary and JSON formatting."}],"contracts":[{"name":"format_summary","meaning":"Produce a human-readable result summary."}],"children":[],"responsibilities":["Formats summaries and structured results, including configured costs and whether the input was synthetic."],"inputs":["BacktestResult"],"outputs":["Readable summary and structured report"],"concepts":[],"sequence":[],"jumps":[]},{"id":"config-cache","parent":"configuration","title":"Transient cache & open candles","kind":"library","tagline":"Keep short-lived state inside one process.","summary":"Each Go process gets its own in-memory store. Ingestion uses it to build the candle for the minute in progress. Execution uses expiring keys to limit repeated entries. Durable order state lives in the journal.","responsibilities":["Keep the current candle as incoming prices arrive.","Store temporary values with an expiry time.","Let callers read a detached candle snapshot.","Remove expired or explicitly deleted temporary keys."],"inputs":["Price and volume updates for the current minute","A key, value and expiry duration"],"outputs":["A snapshot of the open candle","A temporary cached value or a missing/expired result"],"contracts":[{"name":"KV.UpdateCandle / Candle","meaning":"Update or read the minute currently being built."},{"name":"KV.Set / Get","meaning":"Store and read a value with an expiry time."},{"name":"KV.Delete / Sweep","meaning":"Remove specific or expired keys."}],"files":[{"path":"core/fluxkv/fluxkv.go","why":"The shared in-memory cache implementation."}],"children":[],"jumps":[{"id":"ingestion-pipeline","label":"See how ingestion uses the open candle"},{"id":"risk-checks","label":"See the repeated-entry check"}],"concepts":[{"term":"TTL","meaning":"How long a temporary value remains usable before it expires."}]}],"glossary":{"Tick":"One price update from the market.","Candle":"One minute summarized as open, high, low, close and traded volume.","Parquet":"A file format for storing table columns efficiently.","Contract":"What a component promises to accept, return and own, independent of its internal code.","Interface":"The named operations another component can call.","Signal":"A trade suggestion with a symbol, side, quantity, price and decision time.","Fill":"The quantity the broker says actually traded.","Reservation":"Money or shares temporarily held for a pending order.","Reconciliation":"Ask the broker what really happened and bring local account state into agreement.","Idempotency":"Recognize a repeated request so a retry does not create a second order.","Backpressure":"Slow incoming work when the next piece cannot keep up.","Atomic publication":"Make a completed file visible in one step, so readers do not see half a file.","Paper trading":"Simulate execution locally instead of placing a real broker order.","Dry run":"Compute inference decisions but do not send them to execution.","PnL":"Profit or loss.","Equity":"Cash plus the current value of held shares.","Drawdown":"The fall in account value from its previous high.","Registry":"A list of named implementations that callers can choose from.","Fx":"A Go library that supplies dependencies and starts/stops their lifecycle."},"concepts":[{"title":"Parquet files","url":"https://parquet.apache.org/docs/"},{"title":"Go interfaces","url":"https://go.dev/tour/interfaces/1"},{"title":"Kite order lifecycle","url":"https://kite.trade/docs/connect/v3/orders/"},{"title":"Fx startup / shutdown","url":"https://uber-go.github.io/fx/lifecycle.html"}],"revision":"6e41b7d2828b6260198b23ee9aed424e4f48a97c","source_url":"https://github.com/ankit-144/mft/blob/6e41b7d2828b6260198b23ee9aed424e4f48a97c/"}</script>
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('map-data').textContent);
const NODES=new Map(DATA.nodes.map(n=>[n.id,n]));
const ROOT=NODES.get('system');
const expanded=new Set(['system']);
let selected='system',focus='all';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(id,label,cls='jump')=>`<button class="${cls}" data-go="${E(id)}">${E(label)}</button>`;
const list=items=>`<ul class="list">${(items||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul>`;
function trail(id){const t=[];let n=NODES.get(id);while(n){t.unshift(n);n=NODES.get(n.parent)}return t}
function showTree(){
 const query=document.getElementById('search').value.trim().toLowerCase();
 const nav=document.getElementById('nav');
 if(query){const found=DATA.nodes.filter(n=>n.id!=='system'&&JSON.stringify(n).toLowerCase().includes(query));nav.innerHTML=`<div class="nav-heading">${found.length} matching blocks</div>`+found.map(n=>`<button class="search-result" data-go="${n.id}">${E(n.title)}<small>${E(trail(n.id).slice(1,-1).map(p=>p.title).join(' / ')||n.kind)}</small></button>`).join('')+(found.length?'':'<div class="empty">No matching responsibility. Try a filename or interface name.</div>');return}
 function row(id){const n=NODES.get(id),children=n.children||[];return `<div class="nav-row ${selected===id?'active':''}"><button class="disclosure" ${children.length?`data-expand="${id}" aria-expanded="${expanded.has(id)}" aria-label="${expanded.has(id)?'Collapse':'Expand'} ${E(n.title)}"`:'disabled aria-hidden="true"'}>${children.length?(expanded.has(id)?'▾':'▸'):'·'}</button><button class="nav-item" data-go="${id}" ${selected===id?'aria-current="page"':''}>${E(n.title)}</button></div>`+(expanded.has(id)&&children.length?`<div class="nav-depth">${children.map(row).join('')}</div>`:'')}
 nav.innerHTML=button('system','◎ Whole system','nav-item')+'<div class="nav-heading">Services & shared pieces</div>'+ROOT.children.map(row).join('');
}
function svgNode(id,x,y,w,h,title,sub,type,badge=''){
 return `<g class="map-node root-node" data-go="${id}" data-area="${id}" tabindex="0" role="button" aria-label="Explore ${E(title)}"><title>Open ${E(title)}: ${E(sub)}</title><rect class="node-frame" x="${x}" y="${y}" width="${w}" height="${h}" rx="13"/><text class="node-type" x="${x+17}" y="${y+23}">${E(type)}</text><text class="node-title" x="${x+17}" y="${y+47}">${E(title)}</text>${sub?`<text class="node-sub" x="${x+17}" y="${y+69}">${E(sub)}</text>`:''}${badge?`<rect class="node-badge" x="${x+17}" y="${y+h-35}" width="${w-34}" height="23" rx="6"/><text class="node-badge-text" x="${x+25}" y="${y+h-19}">${E(badge)}  ↗</text>`:''}</g>`;
}
function inner(id,x,y,w,label){return `<g class="map-node" data-go="${id}" tabindex="0" role="button" aria-label="Explore ${E(label)}"><rect class="inner-frame" x="${x}" y="${y}" width="${w}" height="30"/><text class="inner-text" x="${x+10}" y="${y+20}">${E(label)} ↗</text></g>`}
function wire(cls,path,label,x,y,double=false){return `<g data-flow="${cls}"><path class="wire ${cls}" d="${path}" marker-end="url(#arrow-${cls})" ${double?`marker-start="url(#arrow-${cls})"`:''}/><text class="edge-label" x="${x}" y="${y}" text-anchor="middle">${E(label)}</text></g>`}
function systemDiagram(){
 const markers=['live','order','history','research','shared'].map(c=>`<marker id="arrow-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--${({live:'blue',order:'green',history:'amber',research:'purple',shared:'muted'})[c]})"/></marker>`).join('');
 return `<section class="card diagram-card"><div class="diagram-head"><h2>The high-level wiring</h2><small>Every box is clickable · four independent service processes</small></div><div class="focus-tabs" role="group" aria-label="Highlight a flow">${[['all','All connections'],['live','Live prices'],['order','Trade & order'],['history','Older history'],['research','Offline research']].map(([id,label])=>`<button class="tab ${focus===id?'active':''}" data-flow-focus="${id}" aria-pressed="${focus===id}">${label}</button>`).join('')}</div><div class="diagram-scroll"><svg class="system-svg" viewBox="0 40 1100 595" role="group" aria-label="High-level clickable architecture diagram"><defs>${markers}</defs>
${wire('live','M196 163 H240','ticks',218,153)}${wire('live','M446 163 H494','bars',470,153)}${wire('live','M700 163 H748','read',724,153)}
${wire('order','M903 261 V332','HTTP · trade suggestion',994,300)}
${wire('order','M748 403 H720 V291 H196','orders ↔ broker state',463,283,true)}
${wire('history','M112 368 V395 H240','history requests',161,387,true)}
${wire('history','M343 337 V251 H545 V230','saved historical buckets',445,244)}
${wire('research','M595 230 V337','saved candles',638,311)}
${wire('research','M838 261 V312 H680 V337','reuse model boundary',766,327)}
${svgNode('broker',26,120,170,248,'Broker','Kite market access','BROKER ACCESS')}
<text class="node-sub" x="43" y="221">Live prices</text><text class="node-sub" x="43" y="249">Orders & updates</text><text class="node-sub" x="43" y="277">History via jobs client</text>${inner('broker-stream',43,309,136,'Live stream')}
${svgNode('ingestion',240,108,206,122,'Ingestion','Save each completed minute','GO SERVICE','Ticks → candles')}
${svgNode('storage',494,108,206,122,'Shared storage','Parquet files on shared disk','FILES + READ/WRITE','Live & historical data')}
${svgNode('inference',748,78,310,183,'Inference','Read a minute → make a suggestion','PYTHON SERVICE')}
${inner('features',765,167,129,'Features')}${inner('models',911,167,130,'Models')}${inner('inference-loop',765,209,276,'Schedule → decide → send')}
${svgNode('jobs',240,337,206,135,'Historical jobs','Fetch older market data','GO SERVICE','Resume finished buckets')}
${svgNode('research',494,337,206,135,'Research','Compare ideas on saved data','OFFLINE TOOL','Strategies & evaluators')}
${svgNode('execution',748,332,310,183,'Execution','Check, remember and place orders','GO SERVICE')}
${inner('execution-engine',765,421,129,'Order engine')}${inner('risk',911,421,130,'Risk')}${inner('risk-book',765,463,129,'Account book')}${inner('execution-journal',911,463,130,'Journal')}
${svgNode('configuration',26,548,420,72,'Settings & startup','','SHARED ACROSS SERVICES')}
${svgNode('operations',494,548,564,72,'Health, metrics & logs','','SHARED ACROSS SERVICES')}
</svg></div><div class="legend"><span style="--c:var(--blue)">Live price data</span><span style="--c:var(--green)">Trade & broker state</span><span style="--c:var(--amber)">Historical fetch</span><span style="--c:var(--purple)">Offline analysis</span></div><div class="callout"><strong>Read this boundary:</strong><span>Risk is inside execution. Storage is shared files and libraries. Research uses saved data; it does not place live orders.</span></div></section>`;
}
function wiringFocus(){
 const svg=document.querySelector('.system-svg');if(!svg)return;
 svg.querySelectorAll('[data-flow]').forEach(e=>e.classList.toggle('dim',focus!=='all'&&e.dataset.flow!==focus));
 const visible={live:['broker','ingestion','storage','inference'],order:['broker','inference','execution'],history:['broker','jobs','storage'],research:['storage','research','inference']};
 svg.querySelectorAll('.root-node').forEach(e=>e.classList.toggle('dim',focus!=='all'&&!visible[focus]?.includes(e.dataset.area)));
}
function partMap(n){const ids=n.children||[];if(!ids.length)return '';const chain=n.sequence||[];return `<section class="card diagram-card"><div class="diagram-head"><h2>Inside ${E(n.title)}</h2><small>${ids.length} smaller responsibilities · open a block to go deeper</small></div>${chain.length?`<p class="mini-label" style="margin:20px 0 5px">Main hand-off path</p><div class="flow-chain">${chain.map((id,i)=>`${i?'<span class="flow-arrow" aria-hidden="true">→</span>':''}<button class="flow-step" data-go="${id}"><b>${i+1}</b>${E(NODES.get(id).title)}</button>`).join('')}</div>`:''}<div class="inside-map">${ids.map(id=>{const c=NODES.get(id);return `<button class="block" data-go="${id}"><span class="open" aria-hidden="true">↗</span><small>${E(c.kind)}</small><strong>${E(c.title)}</strong><span>${E(c.tagline)}</span></button>`}).join('')}</div>${n.id==='execution'?'<div class="callout"><strong>One service, separate duties.</strong><span>The engine coordinates the order. Risk decides whether it fits the limits. The book records filled cash and shares. The journal remembers durable state.</span></div>':''}</section>`}
function sourceCards(n){return `<section class="card"><h2>Where this responsibility lives</h2>${(n.files||[]).map(f=>`<a class="source" href="${DATA.source_url+encodeURI(f.path)}" target="_blank" rel="noopener"><code>${E(f.path)} ↗</code><span>${E(f.why)}</span></a>`).join('')}<p style="font-size:11px;color:var(--muted);margin:16px 0 0">Optional source links open the exact ${DATA.revision.slice(0,7)} snapshot on GitHub.</p></section>`}
function contracts(n){return n.contracts?.length?`<section class="card"><h2>The contract others can rely on</h2>${n.contracts.map(c=>`<div class="contract"><code>${E(c.name)}</code><p>${E(c.meaning)}</p></div>`).join('')}</section>`:''}
function glossary(n){return n.concepts?.length?`<section class="card"><h2>Terms used here</h2>${n.concepts.map(c=>`<div class="definition"><strong>${E(c.term)}</strong><p>${E(c.meaning)}</p></div>`).join('')}</section>`:''}
function related(n){let jumps=[...(n.jumps||[])];for(const c of n.connections||[]){if(!jumps.some(j=>j.id===c.target))jumps.push({id:c.target,label:c.label})}return jumps.length?`<section class="card"><h2>Follow the connection</h2>${jumps.map(j=>button(j.id,j.label+' →')).join('')}</section>`:''}
function routeCards(){return `<div class="reading-routes"><button class="route" data-go="ingestion"><small>Follow the data</small><strong>Price update → candle → decision</strong><span>Start at ingestion, then follow shared storage into inference.</span></button><button class="route" data-go="risk"><small>Understand execution</small><strong>Risk → account book → confirmed fill</strong><span>Open risk, then book.go: what money and shares does it own?</span></button><button class="route" data-go="research-evaluators"><small>Explore an extension</small><strong>Research → evaluator → new metric</strong><span>See how a new measure plugs into the experiment boundary.</span></button></div>`}
function render(id){
 const content=document.getElementById('content');
 if(id==='glossary'){selected=id;content.innerHTML=`<div class="breadcrumbs">${button('system','Whole system','')}<span>›</span> Glossary</div><div class="intro"><div class="eyebrow">Words in the map</div><h1>Small definitions, where you need them.</h1><p class="lead">The terms used at the component boundaries.</p></div><div class="glossary-grid">${Object.entries(DATA.glossary).map(([term,meaning])=>`<section class="card"><h3>${E(term)}</h3><p>${E(meaning)}</p></section>`).join('')}</div><div class="glossary-links">${DATA.concepts.map(c=>`<a href="${E(c.url)}" target="_blank" rel="noopener">${E(c.title)} ↗</a>`).join('')}</div>`;showTree();return}
 const n=NODES.get(id)||ROOT;selected=n.id;
 for(const p of trail(n.id))if(p.children?.length)expanded.add(p.id);
 content.innerHTML=`<div class="breadcrumbs">${trail(n.id).map((p,i)=>`${i?'<span aria-hidden="true">›</span>':''}${p.id===n.id?`<span>${E(p.id==='system'?'Whole system':p.title)}</span>`:button(p.id,p.id==='system'?'Whole system':p.title,'')}`).join('')}</div><div class="intro"><div class="eyebrow">${n.id==='system'?'01 / high-level map':E(n.kind)+' / responsibility map'}</div><h1>${E(n.title)}</h1><p class="lead">${E(n.summary)}</p></div>${n.id==='system'?systemDiagram()+routeCards():partMap(n)}<div class="details-grid"><div class="stack"><section class="card"><h2>${n.id==='system'?'How to read the map':'What this block owns'}</h2>${list(n.responsibilities)}</section><section class="card"><h2>What crosses the boundary</h2><div class="io-grid"><div><p class="mini-label">Receives</p>${list(n.inputs?.length?n.inputs:['See the operations listed in the contract.'])}</div><div><p class="mini-label">Returns / changes</p>${list(n.outputs?.length?n.outputs:['The result or state described by its contract.'])}</div></div></section>${glossary(n)}${related(n)}</div><div class="stack">${contracts(n)}${sourceCards(n)}</div></div><div class="back-top">${n.parent?button(n.parent,'← Back to '+(n.parent==='system'?'the whole system':NODES.get(n.parent).title),''):button('glossary','Open the glossary','')}<span>Source snapshot ${DATA.revision.slice(0,7)} · the guide works offline</span></div>`;
 showTree();wiringFocus();
}
function navigate(id){if(!NODES.has(id)&&id!=='glossary')return;document.getElementById('search').value='';document.getElementById('sidebar').classList.remove('show');if(location.hash.slice(1)!==id)location.hash=id;else render(id);window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{
 const node=e.target.closest('[data-go]');if(node){navigate(node.dataset.go);return}
 const expand=e.target.closest('[data-expand]');if(expand){const id=expand.dataset.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);showTree();return}
 const f=e.target.closest('[data-flow-focus]');if(f){focus=f.dataset.flowFocus;document.querySelectorAll('[data-flow-focus]').forEach(b=>{b.classList.toggle('active',b.dataset.flowFocus===focus);b.setAttribute('aria-pressed',String(b.dataset.flowFocus===focus))});wiringFocus()}
});
document.addEventListener('keydown',e=>{const node=e.target.closest('g[data-go]');if(node&&(e.key==='Enter'||e.key===' ')){e.preventDefault();navigate(node.dataset.go)}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('sidebar').classList.add('show');document.getElementById('search').focus()}if(e.key==='Escape'){document.getElementById('search').value='';showTree();document.getElementById('sidebar').classList.remove('show')}});
document.getElementById('search').addEventListener('input',showTree);
window.addEventListener('hashchange',()=>{render(location.hash.slice(1)||'system');document.getElementById('content').focus({preventScroll:true})});
document.getElementById('menu-toggle').onclick=()=>document.getElementById('sidebar').classList.toggle('show');
const themeButton=document.getElementById('theme-toggle');function applyTheme(dark){document.body.classList.toggle('dark',dark);themeButton.textContent=dark?'Light theme':'Dark theme';themeButton.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}
try{applyTheme(localStorage.getItem('mft-map-theme')==='dark')}catch{}
themeButton.onclick=()=>{const dark=!document.body.classList.contains('dark');applyTheme(dark);try{localStorage.setItem('mft-map-theme',dark?'dark':'light')}catch{}};
document.getElementById('revision').textContent='Offline · master '+DATA.revision.slice(0,7);
document.getElementById('node-count').textContent=DATA.nodes.length+' connected responsibilities';
render(location.hash.slice(1)||'system');
</script>
</body></html>
