<html lang="en">
<head>

<title>MFT · Codebase map</title>
<style>
:root{--bg:#f5f7fa;--paper:#fff;--ink:#19283a;--muted:#62748a;--line:#dce4ee;--accent:#087e72;--tint:#e7f5f0;--blue:#397fcd;--green:#118974;--purple:#8660c6;--amber:#ae7422;--shadow:0 8px 28px #213b5810;--nav:252px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:var(--accent)}button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #2ca69a;outline-offset:3px}header{height:72px;border-bottom:1px solid var(--line);background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:0 28px;gap:16px;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:center;gap:13px}.logo{background:#173e3a;color:#b9f2df;font-weight:800;border-radius:12px;width:39px;height:39px;display:grid;place-items:center}.brand strong{display:block;font-size:18px;letter-spacing:-.4px}.brand small{display:block;color:var(--muted);font-size:12px}.header-tools{display:flex;align-items:center;gap:15px;font-size:12px}.stamp{color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 12px}.ghost{background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink)}.layout{display:grid;grid-template-columns:var(--nav) minmax(0,1fr);min-height:calc(100vh - 72px)}aside{background:var(--paper);border-right:1px solid var(--line);padding:24px 16px;position:sticky;top:72px;height:calc(100vh - 72px);overflow:auto}.searchbox{position:relative;margin-bottom:25px}input{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;color:var(--ink);font-size:13px}.nav-heading{font-size:10px;font-weight:750;letter-spacing:1.8px;text-transform:uppercase;color:var(--muted);margin:23px 9px 10px}.nav-row{display:flex;align-items:center;border-radius:8px;margin:3px 0;min-height:39px}.nav-row.active{background:var(--tint)}.nav-item{min-width:0;flex:1;text-align:left;background:none;border:0;padding:9px 8px;color:var(--ink);font-size:13px;line-height:1.4}.nav-row.active .nav-item{font-weight:700;color:var(--accent)}.disclosure{border:0;background:none;color:var(--muted);width:24px;padding:7px 0;font-size:12px}.nav-depth{border-left:1px solid var(--line);margin-left:11px;padding-left:10px}.nav-row small{color:var(--muted)}.nav-foot{margin-top:28px;padding:14px 9px 0;border-top:1px solid var(--line);color:var(--muted);font-size:12px}.nav-foot a{display:block;margin-top:8px}.search-result{display:block;width:100%;text-align:left;border:0;border-radius:8px;background:none;padding:10px;color:var(--ink)}.search-result:hover{background:var(--tint)}.search-result small{display:block;color:var(--muted);font-size:11px}main{min-width:0;padding:30px 42px 56px;max-width:1640px;width:100%;margin:auto}.breadcrumbs{display:flex;gap:9px;align-items:center;flex-wrap:wrap;min-height:26px;font-size:12px;color:var(--muted);margin-bottom:22px}.breadcrumbs button{color:var(--muted);background:none;border:0;padding:0}.breadcrumbs button:hover{color:var(--accent)}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:1.8px;text-transform:uppercase;margin-bottom:6px}h1{font-size:31px;letter-spacing:-.9px;line-height:1.2;margin:0 0 10px}h2{font-size:17px;letter-spacing:-.3px;margin:0 0 15px}h3{font-size:14px;margin:0 0 6px}.lead{font-size:17px;color:var(--muted);margin:0;max-width:950px;line-height:1.7}.intro{margin-bottom:24px}.card{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:23px;box-shadow:var(--shadow)}.diagram-card{padding:20px 22px;margin-bottom:22px}.diagram-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.diagram-head h2{margin:0}.diagram-head small{color:var(--muted);font-size:12px}.focus-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:17px 0 5px}.tab{font-size:12px;background:var(--bg);color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:5px 12px}.tab.active{color:var(--accent);border-color:#84bfb2;background:var(--tint)}.diagram-scroll{overflow:auto}.system-svg{width:100%;min-width:740px;max-height:560px;display:block}.system-svg text{font-family:inherit;pointer-events:none}.node-frame{fill:var(--paper);stroke:var(--line);stroke-width:1.3;transition:fill .15s,stroke .15s}.map-node{cursor:pointer}.map-node:hover .node-frame,.map-node:focus .node-frame{stroke:var(--accent);fill:var(--tint)}.node-title{fill:var(--ink);font-size:17px;font-weight:750;letter-spacing:-.3px}.node-sub{fill:var(--muted);font-size:12px}.node-type{fill:var(--muted);font-size:9px;font-weight:700;letter-spacing:1px}.node-badge{fill:var(--tint);stroke:none}.node-badge-text{fill:var(--accent);font-size:11px;font-weight:750}.inner-frame{fill:var(--bg);stroke:var(--line);rx:7}.inner-text{fill:var(--ink);font-size:12px;font-weight:600}.wire{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.wire.live{stroke:var(--blue)}.wire.order{stroke:var(--green)}.wire.history{stroke:var(--amber)}.wire.research{stroke:var(--purple)}.wire.shared{stroke:var(--muted);stroke-dasharray:4 5}.edge-label{font-size:10px;font-weight:600;fill:var(--muted);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}.dim{opacity:.19}.legend{display:flex;flex-wrap:wrap;gap:16px;color:var(--muted);font-size:11px;padding-top:7px}.legend span:before{content:"";display:inline-block;width:17px;height:3px;margin:0 6px 3px 0;background:var(--c);border-radius:3px}.callout{display:flex;align-items:flex-start;gap:10px;background:var(--tint);border:1px solid #c2e2d6;border-radius:10px;padding:12px 15px;margin-top:18px;font-size:13px;line-height:1.6}.callout strong{color:var(--accent)}.reading-routes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px;margin-bottom:22px}.route{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:left;color:var(--ink)}.route:hover{border-color:#84bfb2}.route small{display:block;color:var(--accent);font-size:10px;letter-spacing:1px;font-weight:700;text-transform:uppercase;margin-bottom:7px}.route strong{display:block;font-size:14px}.route span{display:block;font-size:12px;color:var(--muted);margin-top:6px}.details-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(300px,1fr);gap:20px;align-items:start}.stack{display:grid;gap:20px}.list{list-style:none;padding:0;margin:0;display:grid;gap:11px}.list li{position:relative;padding-left:18px;line-height:1.65;font-size:14px}.list li:before{content:"";position:absolute;top:10px;left:1px;background:var(--accent);width:5px;height:5px;border-radius:50%}.io-grid{display:grid;grid-template-columns:1fr 1fr;gap:23px}.mini-label{font-size:10px;font-weight:800;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted);margin:0 0 9px}.contract{border-top:1px solid var(--line);padding:13px 0}.contract:first-of-type{border-top:0;padding-top:0}.contract:last-of-type{padding-bottom:0}.contract code{display:block;font-size:12px;color:var(--accent);font-family:ui-monospace,"Cascadia Code",monospace;overflow-wrap:anywhere;margin-bottom:5px}.contract p{color:var(--muted);font-size:13px;line-height:1.6;margin:0}.source{display:block;text-decoration:none;border-top:1px solid var(--line);padding:13px 0;color:var(--ink)}.source:first-of-type{border-top:0;padding-top:0}.source:last-of-type{padding-bottom:0}.source code{color:var(--accent);font-size:11px;overflow-wrap:anywhere}.source span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.definition{padding:10px 0;border-top:1px solid var(--line)}.definition:first-of-type{padding-top:0;border-top:0}.definition strong{font-size:13px}.definition p{margin:4px 0 0;color:var(--muted);font-size:13px}.jump{display:block;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:11px 14px;text-align:left;margin-top:8px;width:100%;font-size:13px;color:var(--ink)}.jump:hover{border-color:var(--accent)}.inside-map{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:21px}.block{position:relative;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:11px;padding:17px;color:var(--ink);min-height:110px;transition:border-color .15s,background .15s}.block:hover{border-color:var(--accent);background:var(--tint)}.block small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.block strong{display:block;font-size:14px;margin:6px 0}.block span{display:block;font-size:12px;color:var(--muted);line-height:1.5}.block .open{position:absolute;right:13px;top:13px;color:var(--accent);font-size:16px}.flow-chain{display:flex;align-items:stretch;gap:8px;overflow:auto;margin-top:20px;padding-bottom:5px}.flow-step{min-width:140px;flex:1;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:11px;text-align:left;color:var(--ink);font-size:12px}.flow-step b{display:block;color:var(--accent);font-size:10px;margin-bottom:4px}.flow-arrow{align-self:center;color:var(--muted);font-size:18px}.back-top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:28px;color:var(--muted);font-size:12px}.back-top button{border:0;background:transparent;color:var(--accent);padding:0}.empty{font-size:13px;color:var(--muted);padding:10px}#menu-toggle{display:none}.guide-notes{margin-top:22px;color:var(--muted);font-size:12px}.glossary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.glossary-grid .card{box-shadow:none;padding:18px}.glossary-grid p{font-size:13px;margin:5px 0 0;color:var(--muted)}.glossary-links{display:flex;flex-wrap:wrap;gap:14px;margin:20px 0;font-size:13px}body.dark{--bg:#111b26;--paper:#172330;--ink:#e2ebf5;--muted:#9cb0c4;--line:#2a3a4c;--accent:#79d7bc;--tint:#203e3b;--blue:#6aa9ef;--green:#6cd4b6;--purple:#b99deb;--amber:#e2b875;--shadow:none}body.dark .callout{border-color:#345b53}body.dark .logo{background:#234c45}body.dark .tab.active{border-color:#488f7c}body.dark input{color:var(--ink)}@media(min-width:1800px){main{padding-top:38px}}@media(max-width:1200px){:root{--nav:220px}main{padding:26px}.details-grid{grid-template-columns:1fr}.reading-routes{gap:10px}.system-svg{min-width:720px}}@media(max-width:780px){header{height:64px;padding:0 16px}.header-tools a,.stamp{display:none}#menu-toggle{display:block}.layout{grid-template-columns:1fr}aside{display:none;position:fixed;left:0;top:64px;width:280px;z-index:19;box-shadow:20px 0 40px #0002;height:calc(100vh - 64px)}aside.show{display:block}main{padding:23px 16px}h1{font-size:27px}.lead{font-size:15px}.reading-routes{grid-template-columns:1fr}.inside-map,.glossary-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.io-grid{grid-template-columns:1fr}.card{padding:18px}.system-svg{min-width:730px}.diagram-head small{max-width:250px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}@media print{header,aside,.focus-tabs,.header-tools,.back-top{display:none}.layout{display:block}main{padding:0}.card{break-inside:avoid;box-shadow:none}.diagram-scroll{overflow:visible}.system-svg{min-width:0}.details-grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="brand"><button class="ghost" id="menu-toggle" aria-label="Open navigation">☰</button><div class="logo">M</div><div><strong>MFT codebase map</strong><small>Responsibilities, connections & contracts</small></div></div><div class="header-tools"><span class="stamp" id="revision"></span><a href="../LOCAL_RUN.md" target="_blank" rel="noopener">Local run guide ↗</a><button class="ghost" id="theme-toggle" aria-label="Switch theme">Dark theme</button></div></header>
<div class="layout"><aside id="sidebar"><div class="searchbox"><label for="search" class="mini-label" style="display:block">Find a responsibility</label><input id="search" type="search" placeholder="Risk, book, evaluator…" autocomplete="off" aria-label="Search components and contracts"></div><nav id="nav" aria-label="Codebase tree"></nav><div class="nav-foot">Start with the diagram. Follow one responsibility at a time.<a href="#glossary">Plain-language glossary →</a><span id="node-count"></span></div></aside><main id="content" tabindex="-1"></main></div>
<!-- MAP_DATA -->
<script>
'use strict';
const DATA=JSON.parse(document.getElementById('map-data').textContent);
const NODES=new Map(DATA.nodes.map(n=>[n.id,n]));
const ROOT=NODES.get('system');
const expanded=new Set(['system']);
let selected='system',focus='all';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(id,label,cls='jump')=>`<button class="${cls}" data-go="${E(id)}">${E(label)}</button>`;
const list=items=>`<ul class="list">${(items||[]).map(x=>`<li>${E(x)}</li>`).join('')}</ul>`;
function trail(id){const t=[];let n=NODES.get(id);while(n){t.unshift(n);n=NODES.get(n.parent)}return t}
function showTree(){
 const query=document.getElementById('search').value.trim().toLowerCase();
 const nav=document.getElementById('nav');
 if(query){const found=DATA.nodes.filter(n=>n.id!=='system'&&JSON.stringify(n).toLowerCase().includes(query));nav.innerHTML=`<div class="nav-heading">${found.length} matching blocks</div>`+found.map(n=>`<button class="search-result" data-go="${n.id}">${E(n.title)}<small>${E(trail(n.id).slice(1,-1).map(p=>p.title).join(' / ')||n.kind)}</small></button>`).join('')+(found.length?'':'<div class="empty">No matching responsibility. Try a filename or interface name.</div>');return}
 function row(id){const n=NODES.get(id),children=n.children||[];return `<div class="nav-row ${selected===id?'active':''}"><button class="disclosure" ${children.length?`data-expand="${id}" aria-expanded="${expanded.has(id)}" aria-label="${expanded.has(id)?'Collapse':'Expand'} ${E(n.title)}"`:'disabled aria-hidden="true"'}>${children.length?(expanded.has(id)?'▾':'▸'):'·'}</button><button class="nav-item" data-go="${id}" ${selected===id?'aria-current="page"':''}>${E(n.title)}</button></div>`+(expanded.has(id)&&children.length?`<div class="nav-depth">${children.map(row).join('')}</div>`:'')}
 nav.innerHTML=button('system','◎ Whole system','nav-item')+'<div class="nav-heading">Services & shared pieces</div>'+ROOT.children.map(row).join('');
}
function svgNode(id,x,y,w,h,title,sub,type,badge=''){
 return `<g class="map-node root-node" data-go="${id}" data-area="${id}" tabindex="0" role="button" aria-label="Explore ${E(title)}"><title>Open ${E(title)}: ${E(sub)}</title><rect class="node-frame" x="${x}" y="${y}" width="${w}" height="${h}" rx="13"/><text class="node-type" x="${x+17}" y="${y+23}">${E(type)}</text><text class="node-title" x="${x+17}" y="${y+47}">${E(title)}</text>${sub?`<text class="node-sub" x="${x+17}" y="${y+69}">${E(sub)}</text>`:''}${badge?`<rect class="node-badge" x="${x+17}" y="${y+h-35}" width="${w-34}" height="23" rx="6"/><text class="node-badge-text" x="${x+25}" y="${y+h-19}">${E(badge)}  ↗</text>`:''}</g>`;
}
function inner(id,x,y,w,label){return `<g class="map-node" data-go="${id}" tabindex="0" role="button" aria-label="Explore ${E(label)}"><rect class="inner-frame" x="${x}" y="${y}" width="${w}" height="30"/><text class="inner-text" x="${x+10}" y="${y+20}">${E(label)} ↗</text></g>`}
function wire(cls,path,label,x,y,double=false){return `<g data-flow="${cls}"><path class="wire ${cls}" d="${path}" marker-end="url(#arrow-${cls})" ${double?`marker-start="url(#arrow-${cls})"`:''}/><text class="edge-label" x="${x}" y="${y}" text-anchor="middle">${E(label)}</text></g>`}
function systemDiagram(){
 const markers=['live','order','history','research','shared'].map(c=>`<marker id="arrow-${c}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--${({live:'blue',order:'green',history:'amber',research:'purple',shared:'muted'})[c]})"/></marker>`).join('');
 return `<section class="card diagram-card"><div class="diagram-head"><h2>The high-level wiring</h2><small>Every box is clickable · four independent service processes</small></div><div class="focus-tabs" role="group" aria-label="Highlight a flow">${[['all','All connections'],['live','Live prices'],['order','Trade & order'],['history','Older history'],['research','Offline research']].map(([id,label])=>`<button class="tab ${focus===id?'active':''}" data-flow-focus="${id}" aria-pressed="${focus===id}">${label}</button>`).join('')}</div><div class="diagram-scroll"><svg class="system-svg" viewBox="0 40 1100 595" role="group" aria-label="High-level clickable architecture diagram"><defs>${markers}</defs>
${wire('live','M196 163 H240','ticks',218,153)}${wire('live','M446 163 H494','bars',470,153)}${wire('live','M700 163 H748','read',724,153)}
${wire('order','M903 261 V332','HTTP · trade suggestion',994,300)}
${wire('order','M748 403 H720 V291 H196','orders ↔ broker state',463,283,true)}
${wire('history','M112 368 V395 H240','history requests',161,387,true)}
${wire('history','M343 337 V251 H545 V230','saved historical buckets',445,244)}
${wire('research','M595 230 V337','saved candles',638,311)}
${wire('research','M838 261 V312 H680 V337','reuse model boundary',766,327)}
${svgNode('broker',26,120,170,248,'Broker','Kite market access','BROKER ACCESS')}
<text class="node-sub" x="43" y="221">Live prices</text><text class="node-sub" x="43" y="249">Orders & updates</text><text class="node-sub" x="43" y="277">History via jobs client</text>${inner('broker-stream',43,309,136,'Live stream')}
${svgNode('ingestion',240,108,206,122,'Ingestion','Save each completed minute','GO SERVICE','Ticks → candles')}
${svgNode('storage',494,108,206,122,'Shared storage','Parquet files on shared disk','FILES + READ/WRITE','Live & historical data')}
${svgNode('inference',748,78,310,183,'Inference','Read a minute → make a suggestion','PYTHON SERVICE')}
${inner('features',765,167,129,'Features')}${inner('models',911,167,130,'Models')}${inner('inference-loop',765,209,276,'Schedule → decide → send')}
${svgNode('jobs',240,337,206,135,'Historical jobs','Fetch older market data','GO SERVICE','Resume finished buckets')}
${svgNode('research',494,337,206,135,'Research','Compare ideas on saved data','OFFLINE TOOL','Strategies & evaluators')}
${svgNode('execution',748,332,310,183,'Execution','Check, remember and place orders','GO SERVICE')}
${inner('execution-engine',765,421,129,'Order engine')}${inner('risk',911,421,130,'Risk')}${inner('risk-book',765,463,129,'Account book')}${inner('execution-journal',911,463,130,'Journal')}
${svgNode('configuration',26,548,420,72,'Settings & startup','','SHARED ACROSS SERVICES')}
${svgNode('operations',494,548,564,72,'Health, metrics & logs','','SHARED ACROSS SERVICES')}
</svg></div><div class="legend"><span style="--c:var(--blue)">Live price data</span><span style="--c:var(--green)">Trade & broker state</span><span style="--c:var(--amber)">Historical fetch</span><span style="--c:var(--purple)">Offline analysis</span></div><div class="callout"><strong>Read this boundary:</strong><span>Risk is inside execution. Storage is shared files and libraries. Research uses saved data; it does not place live orders.</span></div></section>`;
}
function wiringFocus(){
 const svg=document.querySelector('.system-svg');if(!svg)return;
 svg.querySelectorAll('[data-flow]').forEach(e=>e.classList.toggle('dim',focus!=='all'&&e.dataset.flow!==focus));
 const visible={live:['broker','ingestion','storage','inference'],order:['broker','inference','execution'],history:['broker','jobs','storage'],research:['storage','research','inference']};
 svg.querySelectorAll('.root-node').forEach(e=>e.classList.toggle('dim',focus!=='all'&&!visible[focus]?.includes(e.dataset.area)));
}
function partMap(n){const ids=n.children||[];if(!ids.length)return '';const chain=n.sequence||[];return `<section class="card diagram-card"><div class="diagram-head"><h2>Inside ${E(n.title)}</h2><small>${ids.length} smaller responsibilities · open a block to go deeper</small></div>${chain.length?`<p class="mini-label" style="margin:20px 0 5px">Main hand-off path</p><div class="flow-chain">${chain.map((id,i)=>`${i?'<span class="flow-arrow" aria-hidden="true">→</span>':''}<button class="flow-step" data-go="${id}"><b>${i+1}</b>${E(NODES.get(id).title)}</button>`).join('')}</div>`:''}<div class="inside-map">${ids.map(id=>{const c=NODES.get(id);return `<button class="block" data-go="${id}"><span class="open" aria-hidden="true">↗</span><small>${E(c.kind)}</small><strong>${E(c.title)}</strong><span>${E(c.tagline)}</span></button>`}).join('')}</div>${n.id==='execution'?'<div class="callout"><strong>One service, separate duties.</strong><span>The engine coordinates the order. Risk decides whether it fits the limits. The book records filled cash and shares. The journal remembers durable state.</span></div>':''}</section>`}
function sourceCards(n){return `<section class="card"><h2>Where this responsibility lives</h2>${(n.files||[]).map(f=>`<a class="source" href="${DATA.source_url+encodeURI(f.path)}" target="_blank" rel="noopener"><code>${E(f.path)} ↗</code><span>${E(f.why)}</span></a>`).join('')}<p style="font-size:11px;color:var(--muted);margin:16px 0 0">Optional source links open the exact ${DATA.revision.slice(0,7)} snapshot on GitHub.</p></section>`}
function contracts(n){return n.contracts?.length?`<section class="card"><h2>The contract others can rely on</h2>${n.contracts.map(c=>`<div class="contract"><code>${E(c.name)}</code><p>${E(c.meaning)}</p></div>`).join('')}</section>`:''}
function glossary(n){return n.concepts?.length?`<section class="card"><h2>Terms used here</h2>${n.concepts.map(c=>`<div class="definition"><strong>${E(c.term)}</strong><p>${E(c.meaning)}</p></div>`).join('')}</section>`:''}
function related(n){let jumps=[...(n.jumps||[])];for(const c of n.connections||[]){if(!jumps.some(j=>j.id===c.target))jumps.push({id:c.target,label:c.label})}return jumps.length?`<section class="card"><h2>Follow the connection</h2>${jumps.map(j=>button(j.id,j.label+' →')).join('')}</section>`:''}
function routeCards(){return `<div class="reading-routes"><button class="route" data-go="ingestion"><small>Follow the data</small><strong>Price update → candle → decision</strong><span>Start at ingestion, then follow shared storage into inference.</span></button><button class="route" data-go="risk"><small>Understand execution</small><strong>Risk → account book → confirmed fill</strong><span>Open risk, then book.go: what money and shares does it own?</span></button><button class="route" data-go="research-evaluators"><small>Explore an extension</small><strong>Research → evaluator → new metric</strong><span>See how a new measure plugs into the experiment boundary.</span></button></div>`}
function render(id){
 const content=document.getElementById('content');
 if(id==='glossary'){selected=id;content.innerHTML=`<div class="breadcrumbs">${button('system','Whole system','')}<span>›</span> Glossary</div><div class="intro"><div class="eyebrow">Words in the map</div><h1>Small definitions, where you need them.</h1><p class="lead">The terms used at the component boundaries.</p></div><div class="glossary-grid">${Object.entries(DATA.glossary).map(([term,meaning])=>`<section class="card"><h3>${E(term)}</h3><p>${E(meaning)}</p></section>`).join('')}</div><div class="glossary-links">${DATA.concepts.map(c=>`<a href="${E(c.url)}" target="_blank" rel="noopener">${E(c.title)} ↗</a>`).join('')}</div>`;showTree();return}
 const n=NODES.get(id)||ROOT;selected=n.id;
 for(const p of trail(n.id))if(p.children?.length)expanded.add(p.id);
 content.innerHTML=`<div class="breadcrumbs">${trail(n.id).map((p,i)=>`${i?'<span aria-hidden="true">›</span>':''}${p.id===n.id?`<span>${E(p.id==='system'?'Whole system':p.title)}</span>`:button(p.id,p.id==='system'?'Whole system':p.title,'')}`).join('')}</div><div class="intro"><div class="eyebrow">${n.id==='system'?'01 / high-level map':E(n.kind)+' / responsibility map'}</div><h1>${E(n.title)}</h1><p class="lead">${E(n.summary)}</p></div>${n.id==='system'?systemDiagram()+routeCards():partMap(n)}<div class="details-grid"><div class="stack"><section class="card"><h2>${n.id==='system'?'How to read the map':'What this block owns'}</h2>${list(n.responsibilities)}</section><section class="card"><h2>What crosses the boundary</h2><div class="io-grid"><div><p class="mini-label">Receives</p>${list(n.inputs?.length?n.inputs:['See the operations listed in the contract.'])}</div><div><p class="mini-label">Returns / changes</p>${list(n.outputs?.length?n.outputs:['The result or state described by its contract.'])}</div></div></section>${glossary(n)}${related(n)}</div><div class="stack">${contracts(n)}${sourceCards(n)}</div></div><div class="back-top">${n.parent?button(n.parent,'← Back to '+(n.parent==='system'?'the whole system':NODES.get(n.parent).title),''):button('glossary','Open the glossary','')}<span>Source snapshot ${DATA.revision.slice(0,7)} · the guide works offline</span></div>`;
 showTree();wiringFocus();
}
function navigate(id){if(!NODES.has(id)&&id!=='glossary')return;document.getElementById('search').value='';document.getElementById('sidebar').classList.remove('show');if(location.hash.slice(1)!==id)location.hash=id;else render(id);window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('click',e=>{
 const node=e.target.closest('[data-go]');if(node){navigate(node.dataset.go);return}
 const expand=e.target.closest('[data-expand]');if(expand){const id=expand.dataset.expand;expanded.has(id)?expanded.delete(id):expanded.add(id);showTree();return}
 const f=e.target.closest('[data-flow-focus]');if(f){focus=f.dataset.flowFocus;document.querySelectorAll('[data-flow-focus]').forEach(b=>{b.classList.toggle('active',b.dataset.flowFocus===focus);b.setAttribute('aria-pressed',String(b.dataset.flowFocus===focus))});wiringFocus()}
});
document.addEventListener('keydown',e=>{const node=e.target.closest('g[data-go]');if(node&&(e.key==='Enter'||e.key===' ')){e.preventDefault();navigate(node.dataset.go)}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();document.getElementById('sidebar').classList.add('show');document.getElementById('search').focus()}if(e.key==='Escape'){document.getElementById('search').value='';showTree();document.getElementById('sidebar').classList.remove('show')}});
document.getElementById('search').addEventListener('input',showTree);
window.addEventListener('hashchange',()=>{render(location.hash.slice(1)||'system');document.getElementById('content').focus({preventScroll:true})});
document.getElementById('menu-toggle').onclick=()=>document.getElementById('sidebar').classList.toggle('show');
const themeButton=document.getElementById('theme-toggle');function applyTheme(dark){document.body.classList.toggle('dark',dark);themeButton.textContent=dark?'Light theme':'Dark theme';themeButton.setAttribute('aria-label',dark?'Switch to light theme':'Switch to dark theme')}
try{applyTheme(localStorage.getItem('mft-map-theme')==='dark')}catch{}
themeButton.onclick=()=>{const dark=!document.body.classList.contains('dark');applyTheme(dark);try{localStorage.setItem('mft-map-theme',dark?'dark':'light')}catch{}};
document.getElementById('revision').textContent='Offline · master '+DATA.revision.slice(0,7);
document.getElementById('node-count').textContent=DATA.nodes.length+' connected responsibilities';
render(location.hash.slice(1)||'system');
</script>
</body></html>
