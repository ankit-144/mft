# Observability stack for the MFT platform: Prometheus and Grafana only.
#
# The trading services are deliberately NOT started here. `make dev` runs them
# on the host, and Prometheus reaches them through host.docker.internal. One
# stack, two places, no port juggling between two compose files.
#
#   make dev                        # terminal 1 — the four services
#   docker compose -f observability/docker-compose.observability.yml up -d
#
# Prometheus  http://localhost:9099   (9090 is ingestion's metrics port)
# Grafana     http://localhost:3000   admin / admin
#
# Both are bound to 127.0.0.1: this is a local research platform and the
# dashboards should not be reachable from the network.

name: mft-observability

services:
  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: mft-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Lets the container reach the host, where `make dev` runs the services.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:9099:9090"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    container_name: mft-grafana
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/mft-overview.json
      GF_LOG_LEVEL: warn
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:
