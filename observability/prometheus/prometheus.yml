# Prometheus scrape configuration for the MFT platform.
#
# The four services run on the host (make dev), not in Docker, so they are
# reached through host.docker.internal — see docker-compose.observability.yml,
# which maps that name onto the host gateway.
#
# Port map (Plan.md §7):
#   ingestion   metrics :9090
#   execution   api     :8080   metrics :9091
#   jobs        metrics :9092
#   inference   api     :8000   (no metrics endpoint yet — see README.md)

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    platform: mft

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: ingestion
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9090"]
        labels:
          service: ingestion

  - job_name: execution
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9091"]
        labels:
          service: execution

  - job_name: jobs
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:9092"]
        labels:
          service: jobs

  # C10's FastAPI service. The job is declared now so the target shows up as
  # DOWN and the gap is visible, rather than being silently missing.
  - job_name: inference
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels:
          service: inference
