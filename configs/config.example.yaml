# MFT platform configuration.
#
# This file is the FROZEN schema — every key is documented in
# docs/contracts.md §8. Copy to configs/config.yaml and fill in credentials.
#
# The schema is complete and intentionally stable: components add features
# without editing it, so ten parallel branches never conflict here.

app:
  name: mft
  env: dev                 # dev | staging | prod
  log_level: info          # debug | info | warn | error
  timezone: Asia/Kolkata

metrics:
  addr: ":9090"
  path: /metrics

broker:
  api_key: ""              # KITE_API_KEY
  api_secret: ""           # KITE_API_SECRET
  access_token: ""         # KITE_ACCESS_TOKEN
  product: MIS             # MIS (intraday) | NRML | CNC
  instruments:
    - RELIANCE
    - TCS
    - INFY
  reconnect_max_backoff_seconds: 60
  request_timeout_seconds: 10

storage:
  data_dir: data
  flush_interval_seconds: 300
  flush_max_rows: 10000
  partition_by: date

analytics:
  duckdb_path: data/mft.duckdb
  read_only: true

execution:
  addr: ":8080"
  capital: 1000000
  debounce_ttl_seconds: 300
  idempotency_ttl_seconds: 86400
  max_position_pct: 10.0
  max_open_positions: 10
  max_drawdown_pct: 5.0
  daily_loss_limit: 25000
  max_order_quantity: 500
  # NSE trading holidays as YYYY-MM-DD. Empty means every weekday trades.
  market_holidays: []

inference:
  addr: ":8000"
  model: tabfm             # tabfm | heuristic
  execution_url: "http://localhost:8080"
  context_rows: 100
  horizon_bars: 1
  score_threshold: 0.55
  order_quantity: 10
  instruments:
    - RELIANCE
    - TCS
    - INFY
  dry_run: true            # true = never place a real order

jobs:
  schedule: "0 2 * * 6"
  rate_limit_per_second: 3
  historical_dir: data/historical
  backfill_lookback_days: 730
