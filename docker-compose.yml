services:
  ingestion:
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    container_name: mft-ingestion
    environment:
      MFT_CONFIG: /app/configs/config.yaml
      MFT_SERVICE_NAME: ingestion
    volumes:
      - mft_data:/app/data
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  execution:
    build:
      context: .
      dockerfile: services/execution/Dockerfile
    container_name: mft-execution
    environment:
      MFT_CONFIG: /app/configs/config.yaml
      MFT_SERVICE_NAME: execution
      MFT_EXECUTION_ADDR: ":8080"
    volumes:
      - mft_data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:9091:9090"
    restart: unless-stopped
    depends_on:
      - ingestion

  jobs:
    build:
      context: .
      dockerfile: services/jobs/Dockerfile
    container_name: mft-jobs
    environment:
      MFT_CONFIG: /app/configs/config.yaml
      MFT_SERVICE_NAME: jobs
    volumes:
      - mft_data:/app/data
    ports:
      - "127.0.0.1:9092:9090"
    restart: unless-stopped
    depends_on:
      - ingestion

  inference:
    build:
      context: .
      dockerfile: services/inference/Dockerfile
    container_name: mft-inference
    environment:
      MFT_CONFIG: /app/configs/config.yaml
      MFT_INFERENCE_MODEL: heuristic
      MFT_EXECUTION_URL: "http://execution:8080"
    volumes:
      - mft_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - execution
    restart: unless-stopped

volumes:
  mft_data:
